 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Mart - Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071a2f, #0b3d63);
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      padding: 30px 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 35px #0004;
      text-align: center;
    }

    h1 {
      color: #0b3d63;
      margin-top: 0;
    }

    p {
      color: #666;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #0b3d63;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #otpSection {
      display: none;
    }

    #message {
      margin-top: 16px;
      overflow-wrap: anywhere;
    }

    #recaptcha-container {
      display: flex;
      justify-content: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h1>Shopping Mart</h1>
    <p>Login with your mobile number</p>

    <form id="phoneForm">
      <input
        id="phone"
        type="tel"
        placeholder="Mobile number (+91XXXXXXXXXX)"
        autocomplete="tel"
        required
      >
      <button id="sendBtn" type="submit">Send OTP</button>
    </form>

    <div id="recaptcha-container"></div>

    <div id="otpSection">
      <p>Enter the OTP received by SMS</p>
      <input
        id="otp"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        placeholder="Enter 6-digit OTP"
        maxlength="6"
      >
      <button id="verifyBtn" type="button">Verify OTP</button>
    </div>

    <p id="message" role="status" aria-live="polite"></p>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
      getAuth,
      RecaptchaVerifier,
      signInWithPhoneNumber
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBN52HX9DQS7nhw_XSr1zPq19Paiqvncfg",
      authDomain: "shopping-mart-ea1b4.firebaseapp.com",
      projectId: "shopping-mart-ea1b4",
      storageBucket: "shopping-mart-ea1b4.firebasestorage.app",
      messagingSenderId: "811806010630",
      appId: "1:811806010630:web:2ead476143f13e99b48287",
      measurementId: "G-JXK43G8JTX"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const phoneForm = document.getElementById("phoneForm");
    const phoneInput = document.getElementById("phone");
    const otpInput = document.getElementById("otp");
    const otpSection = document.getElementById("otpSection");
    const sendBtn = document.getElementById("sendBtn");
    const verifyBtn = document.getElementById("verifyBtn");
    const message = document.getElementById("message");

    let confirmationResult = null;
    let recaptchaVerifier = null;

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.style.color = isError ? "#c62828" : "#18743b";
    }

    try {
      recaptchaVerifier = new RecaptchaVerifier(
        auth,
        "recaptcha-container",
        {
          size: "normal",
          callback: () => {
            showMessage("Captcha verified. You can request an OTP.");
          },
          "expired-callback": () => {
            showMessage("Captcha expired. Please verify it again.", true);
          }
        }
      );

      await recaptchaVerifier.render();
    } catch (error) {
      showMessage(
        "Captcha setup failed. Check Firebase authorized domains and reload.",
        true
      );
      console.error(error);
    }

    phoneForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      let phone = phoneInput.value.trim().replace(/[\s()-]/g, "");

      if (/^[6-9]\d{9}$/.test(phone)) {
        phone = "+91" + phone;
      }

      if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
        showMessage(
          "Enter a valid number with country code, e.g. +919876543210.",
          true
        );
        return;
      }

      if (!recaptchaVerifier) {
        showMessage("Captcha is not ready. Reload the page and try again.", true);
        return;
      }

      sendBtn.disabled = true;
      showMessage("Sending OTP...");

      try {
        confirmationResult = await signInWithPhoneNumber(
          auth,
          phone,
          recaptchaVerifier
        );

        otpSection.style.display = "block";
        showMessage("OTP sent. Check your SMS messages.");
        otpInput.focus();
      } catch (error) {
        console.error(error);
        showMessage(
          error.code === "auth/invalid-phone-number"
            ? "Invalid phone number. Include the correct country code."
            : "OTP could not be sent. Check Firebase Phone settings, SMS quota and reCAPTCHA, then try again.",
          true
        );

        try {
          if (recaptchaVerifier) {
            await recaptchaVerifier.render();
            recaptchaVerifier.clear();
          }
        } catch (_) {
          // Reload the page if reCAPTCHA cannot be reset.
        }

        recaptchaVerifier = null;
        try {
          recaptchaVerifier = new RecaptchaVerifier(
            auth,
            "recaptcha-container",
            { size: "normal" }
          );
          await recaptchaVerifier.render();
        } catch (captchaError) {
          console.error(captchaError);
        }
      } finally {
        sendBtn.disabled = false;
      }
    });

    verifyBtn.addEventListener("click", async () => {
      const otp = otpInput.value.trim();

      if (!confirmationResult) {
        showMessage("First request an OTP.", true);
        return;
      }

      if (!/^\d{6}$/.test(otp)) {
        showMessage("Enter the 6-digit OTP.", true);
        return;
      }

      verifyBtn.disabled = true;
      showMessage("Verifying OTP...");

      try {
        await confirmationResult.confirm(otp);
        showMessage("OTP verified! Opening T-shirt collection...");

        window.location.replace(
          "https://guaravjha14882-hash.github.io/t-shirt-collection-/"
        );
      } catch (error) {
        console.error(error);
        showMessage(
          "OTP verification failed. Check the code or request a new OTP.",
          true
        );
        verifyBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
